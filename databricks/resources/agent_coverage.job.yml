resources:
  jobs:
    agent_coverage:
      name: hackcamp-agent-coverage-500
      description: Investigate up to 500 additional eligible repositories in saved batches of at most 50.
      max_concurrent_runs: 1
      timeout_seconds: 21600
      parameters:
        - name: coverage_target
          default: "500"
        - name: model_endpoint
          default: databricks-meta-llama-3-3-70b-instruct
        - name: max_tool_calls
          default: "8"
        - name: repo_timeout_sec
          default: "180"
        - name: experiment_path
          default: /Users/${workspace.current_user.userName}/hackcamp-agent
      tasks:
        - task_key: prepare_trace_steps
          sql_task:
            file:
              path: ../src/setup/create_trace_steps.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: prepare_coverage
          depends_on:
            - task_key: prepare_trace_steps
          notebook_task:
            notebook_path: ../src/agent/prepare_coverage.py
            source: WORKSPACE
            base_parameters:
              coverage_id: "{{job.run_id}}"
              coverage_target: "{{job.parameters.coverage_target}}"
          environment_key: agent_env
        - task_key: batch_01
          depends_on:
            - task_key: prepare_coverage
          max_retries: 0
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../src/agent/run_investigation.py
            source: WORKSPACE
            base_parameters:
              budget_n: "{{tasks.prepare_coverage.values.batch_01_budget}}"
              uninvestigated_only: "true"
              coverage_id: "{{job.run_id}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              max_tool_calls: "{{job.parameters.max_tool_calls}}"
              repo_timeout_sec: "{{job.parameters.repo_timeout_sec}}"
              experiment_path: "{{job.parameters.experiment_path}}"
          environment_key: agent_env
