resources:
  jobs:
    agent_run:
      name: hackcamp-agent-run
      max_concurrent_runs: 1
      parameters:
        - name: budget_n
          default: "10"
        - name: uninvestigated_only
          default: "false"
        - name: model_endpoint
          default: databricks-meta-llama-3-3-70b-instruct
        - name: max_tool_calls
          default: "8"
        - name: repo_timeout_sec
          default: "180"
        - name: experiment_path
          default: /Users/${workspace.current_user.userName}/hackcamp-agent
      tasks:
        - task_key: prepare_trace_steps
          sql_task:
            file:
              path: ../src/setup/create_trace_steps.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: investigate
          depends_on:
            - task_key: prepare_trace_steps
          notebook_task:
            notebook_path: ../src/agent/run_investigation.py
            source: WORKSPACE
            base_parameters:
              budget_n: "{{job.parameters.budget_n}}"
              uninvestigated_only: "{{job.parameters.uninvestigated_only}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              max_tool_calls: "{{job.parameters.max_tool_calls}}"
              repo_timeout_sec: "{{job.parameters.repo_timeout_sec}}"
              experiment_path: "{{job.parameters.experiment_path}}"
          environment_key: agent_env
        - task_key: verify_traces
          depends_on:
            - task_key: investigate
          notebook_task:
            notebook_path: ../src/agent/verify_traces.py
            source: WORKSPACE
            base_parameters:
              run_id: "{{tasks.investigate.values.run_id}}"
              volume_path: ${var.volume_path}
          environment_key: agent_env

      environments:
        - environment_key: agent_env
          spec:
            environment_version: "4"
            dependencies:
              - "mlflow[databricks]>=3.1.0"
              - "openai>=1.40.0"
              - "pydantic>=2.0"
              - "databricks-sdk>=0.36.0"
