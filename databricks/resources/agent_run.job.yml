resources:
  jobs:
    agent_run:
      name: hackcamp-agent-run
      max_concurrent_runs: 1
      parameters:
        - name: budget_n
          default: "5"
        - name: model_endpoint
          default: databricks-meta-llama-3-3-70b-instruct
        - name: max_tool_calls
          default: "8"
        - name: repo_timeout_sec
          default: "180"
        - name: experiment_path
          default: /Users/philip03ho@gmail.com/hackcamp-agent
      tasks:
        - task_key: investigate
          notebook_task:
            notebook_path: ../src/agent/run_investigation.py
            source: WORKSPACE
            base_parameters:
              budget_n: "{{job.parameters.budget_n}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              max_tool_calls: "{{job.parameters.max_tool_calls}}"
              repo_timeout_sec: "{{job.parameters.repo_timeout_sec}}"
              experiment_path: "{{job.parameters.experiment_path}}"
          environment_key: agent_env

      environments:
        - environment_key: agent_env
          spec:
            environment_version: "4"
            dependencies:
              - "mlflow[databricks]>=3.1.0"
              - "openai>=1.40.0"
              - "pydantic>=2.0"
              - "databricks-sdk>=0.36.0"
