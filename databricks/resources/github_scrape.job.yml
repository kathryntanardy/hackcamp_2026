resources:
  jobs:
    github_scrape:
      name: hackcamp-github-scrape
      description: >
        Freeze 1,000 unique real GitHub repos (F1 / #3) plus description, topics
        and security advisories (F14/F15 / #31).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      parameters:
        - name: repo_source
          default: "discover"
        - name: volume_path
          default: ${var.volume_path}
        - name: repo_limit
          default: "1000"
        - name: minimum_repos
          default: "1000"
        - name: batch_size
          default: "10"
        - name: publish
          default: "true"
        - name: fetch_advisories
          default: "true"
      tasks:
        - task_key: scrape_github
          notebook_task:
            notebook_path: ../src/ingest/scrape_github_repos.py
            source: WORKSPACE
            base_parameters:
              repo_source: "{{job.parameters.repo_source}}"
              volume_path: "{{job.parameters.volume_path}}"
              repo_limit: "{{job.parameters.repo_limit}}"
              minimum_repos: "{{job.parameters.minimum_repos}}"
              batch_size: "{{job.parameters.batch_size}}"
              publish: "{{job.parameters.publish}}"
              fetch_advisories: "{{job.parameters.fetch_advisories}}"
          environment_key: scrape_env
          max_retries: 0
      environments:
        - environment_key: scrape_env
          spec:
            environment_version: "4"
