resources:
  jobs:
    lineage_capture:
      name: hackcamp-lineage-capture
      description: >
        F11 / ticket #16 — stamp gold→findings lineage and refresh the
        verdicts_lineage demo view for Catalog Explorer.
      max_concurrent_runs: 1
      tasks:
        - task_key: capture_lineage
          sql_task:
            file:
              path: ../src/setup/capture_lineage.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: verify_lineage
          depends_on:
            - task_key: capture_lineage
          notebook_task:
            notebook_path: ../src/setup/verify_lineage.py
            source: WORKSPACE
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
