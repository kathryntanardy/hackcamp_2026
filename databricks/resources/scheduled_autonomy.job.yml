resources:
  jobs:
    scheduled_autonomy:
      name: hackcamp-scheduled-autonomy
      description: >
        Nightly refresh of existing GitHub repos → repo_health pipeline (bronze→silver→gold scoring)
        → agent investigation → findings and summaries.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        # Every night at 11 PM in the user's Vancouver timezone.
        # Pause from the UI if you need to stop overnight credit burn.
        quartz_cron_expression: "0 0 23 * * ?"
        timezone_id: America/Vancouver
        pause_status: UNPAUSED
      parameters:
        - name: budget_n
          default: "10"
        - name: model_endpoint
          default: databricks-meta-llama-3-3-70b-instruct
        - name: max_tool_calls
          default: "8"
        - name: repo_timeout_sec
          default: "180"
        - name: experiment_path
          default: /Users/${workspace.current_user.userName}/hackcamp-agent
      tasks:
        - task_key: scrape_github
          run_job_task:
            job_id: ${resources.jobs.github_scrape.id}
            job_parameters:
              repo_source: "existing"
              repo_limit: "1000"
              minimum_repos: "1000"
              publish: "true"
              fetch_advisories: "true"

        # Pipeline includes gold scoring — no separate score task needed.
        - task_key: refresh_pipeline
          depends_on:
            - task_key: scrape_github
          pipeline_task:
            pipeline_id: ${resources.pipelines.repo_health.id}
            # Each scrape replaces stable filenames; reread the entire new snapshot.
            full_refresh: true

        - task_key: run_agent
          depends_on:
            - task_key: refresh_pipeline
          run_job_task:
            job_id: ${resources.jobs.agent_run.id}
            job_parameters:
              budget_n: "{{job.parameters.budget_n}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              max_tool_calls: "{{job.parameters.max_tool_calls}}"
              repo_timeout_sec: "{{job.parameters.repo_timeout_sec}}"
              experiment_path: "{{job.parameters.experiment_path}}"

        # Ticket #20: summarise whatever the agent didn't investigate this run.
        - task_key: summarize_uninvestigated
          depends_on:
            - task_key: run_agent
          sql_task:
            file:
              path: ../src/summaries/summarize_uninvestigated.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
