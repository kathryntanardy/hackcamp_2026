resources:
  jobs:
    seed_eval_labels:
      name: hackcamp-seed-eval-labels
      max_concurrent_runs: 1
      tasks:
        - task_key: seed_labels
          notebook_task:
            notebook_path: ../src/setup/seed_eval_labels.py
            source: WORKSPACE
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
