                "@type": "Question",
                "name": "What is Open Commitment Issues?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Commitment Issues is an interactive map of GitHub maintainer risk. Repos cluster by vulnerability bucket; a Databricks agent investigates worrying packages and shows evidence humans can act on."
                }
              },
              {
                "@type": "Question",
                "name": "How many repositories does Open Commitment Issues track?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Commitment Issues tracks a frozen corpus of about 1,000 unique eligible public GitHub repositories across core languages after confirmed deprecation exclusions."
                }
              },
              {
                "@type": "Question",
                "name": "Are vulnerability buckets the same as agent verdicts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Vulnerability buckets on Open Commitment Issues come from GitHub security advisory CWEs. Agent risk_level is maintainer-risk and is scored separately from advisory severity."
                }
              },
              {
                "@type": "Question",
                "name": "Does Open Commitment Issues include a chatbot?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Open Commitment Issues is a map-and-findings product. Natural-language map search zooms to matching repos via Vector Search; it is search, not a chat interface."
                }
              },
              {
                "@type": "Question",
                "name": "Does Open Commitment Issues replace Dependabot or CodeQL?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Open Commitment Issues tracks maintainer abandonment risk with agent evidence. It does not replace Dependabot, CodeQL, or a full SAST scanner."
                }
              },
              {
                "@type": "Question",
                "name": "Where do security advisories come from?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Commitment Issues loads GitHub Security Advisories (GHSA/CVE) per repository. An empty successful fetch shows No GitHub advisories, never safe."
                }
              },
              {
                "@type": "Question",
                "name": "What platform powers Open Commitment Issues?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Commitment Issues runs ingestion, Unity Catalog governance, agent tools, Vector Search, evaluation, and scheduling on Databricks."
                }
              },

                  "@type": "Answer",
